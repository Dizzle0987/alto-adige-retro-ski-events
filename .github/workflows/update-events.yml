name: Update verified ski events

on:
  schedule:
    - cron: "0 6 * * 1,3,4"
    - cron: "0 7 * * 1,3,4"
  workflow_dispatch:
    inputs:
      instagram_mode:
        description: "Live scan within free credits, or replay the last stored dataset without starting an Actor"
        type: choice
        options: [live, replay]
        default: live

permissions:
  contents: write

concurrency:
  group: update-retro-ski-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check local schedule
        id: schedule
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$(TZ=Europe/Rome date +%H)" == "08" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify social dates, source checks and free-credit guard
        if: steps.schedule.outputs.run == 'true'
        run: node --test scripts/*.test.mjs

      - name: Refresh dates from official sources
        if: steps.schedule.outputs.run == 'true' && inputs.instagram_mode != 'replay'
        run: node scripts/update-events.mjs

      - name: Discover candidates from ski areas, huts and social sources
        if: steps.schedule.outputs.run == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN || secrets.APIFY }}
          APIFY_REPLAY_LAST: ${{ inputs.instagram_mode == 'replay' && '1' || '0' }}
        run: node scripts/discover-events.mjs

      - name: Detect changes
        if: steps.schedule.outputs.run == 'true'
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit verified updates
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/events.json data/event-candidates.json
          git commit -m "chore: refresh verified ski events"
          git push origin HEAD:main

      - name: Publish GitHub Pages branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git subtree split --prefix dist -b automatic-gh-pages
          git push origin automatic-gh-pages:gh-pages
